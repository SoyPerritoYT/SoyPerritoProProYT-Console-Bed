<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐶 Modo Amigos</title><style>body{margin:0;background:linear-gradient(135deg,#164b2a,#123b61);font-family:Arial;color:white;min-height:100vh}.box{max-width:650px;margin:30px auto;padding:20px}.card{background:#101820ee;border:1px solid #ffffff30;border-radius:16px;padding:16px;margin:10px 0}input,button{box-sizing:border-box;width:100%;padding:12px;margin:5px 0;border:0;border-radius:9px}button{background:#2f8f3a;color:white;font-weight:bold}.friend{display:flex;justify-content:space-between;align-items:center;background:#263746;padding:12px;border-radius:9px;margin:6px 0}.online{color:#55e37a}.offline{color:#aaa}.small{width:auto;padding:8px 12px;margin-left:8px}.back{background:#263746}</style></head><body><div class="box"><div class="card"><h1>👥 Modo Amigos</h1><p>Tu estado: <b class="online">🟢 EN LÍNEA</b></p><p>Conecta con amigos de SoyPerritoProProYT-Bed.</p><button class="back" onclick="location.href='index.html'">⬅️ Volver al juego</button></div><div class="card"><h2>👤 Tu nombre</h2><input id="user" maxlength="16" placeholder="Ej: SoyPerrito"><button onclick="login()">🟢 Ponerme en línea</button></div><div class="card"><h2>➕ Añadir amigo</h2><input id="add" maxlength="16" placeholder="Nombre del amigo"><button onclick="addFriend()">Añadir amigo</button></div><div class="card"><h2>👥 Mis amigos</h2><div id="list">Inicia sesión para verlos.</div></div></div><script>const RELAY='wss://soyperritoproproyt-console-bed.onrender.com';let ws=null;function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o))}function login(){const n=document.getElementById('user').value.trim();if(!n)return alert('Escribe tu nombre');ws=new WebSocket(RELAY);ws.onopen=()=>send({type:'presence_join',username:n});ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='presence'||m.type==='friends')render(m.friends||m.records||[]);if(m.type==='presence_update')send({type:'friends_list'});if(m.type==='friend_request')alert('👋 '+m.from+' te ha añadido como amigo');if(m.type==='error')alert('⚠️ '+m.message)};ws.onclose=()=>document.querySelector('p b').textContent='🔴 DESCONECTADO'}function addFriend(){const n=document.getElementById('add').value.trim();if(n)send({type:'friend_add',name:n})}function render(a){const el=document.getElementById('list');el.innerHTML='';if(!a.length){el.textContent='Todavía no tienes amigos añadidos.';return}a.forEach(f=>{const d=document.createElement('div');d.className='friend';const s=f.online?'<span class="online">🟢 En línea</span>':'<span class="offline">⚫ Desconectado</span>';d.innerHTML='<b>'+f.name+'</b>'+s;el.append(d)})}</script></body></html>
