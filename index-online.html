round:#263746;color:#fff;border:1px solid #667;border-radius:8px}.chatlog{height:180px;overflow:auto;background:#0006;padding:7px}.mobile{display:none;position:fixed;z-index:6;touch-action:none}.joy{left:15px;bottom:22px;width:125px;height:125px;border-radius:50%;background:#0005;border:2px solid #fff5}.knob{position:absolute;left:50%;top:50%;width:55px;height:55px;margin:-27px;border-radius:50%;background:#fff6}.tools{right:14px;bottom:22px;flex-direction:column;gap:5px}.tools button{width:58px;height:58px;background:#14202dcc;color:#fff;border:1px solid #fff6;border-radius:10px;font-size:20px}@media(pointer:coarse){.mobile{display:flex}}</style><body><div id="menu"><div class="box"><h1>🐶 SoyPerritoProProYT-Bed</h1><p>🌐 Cliente 3D conectado a Bedrock real</p><button class="play" id="play">▶️ JUGAR</button><button id="servers">🖥️ SERVIDORES</button><button id="create">🌍 MUNDO LOCAL</button><div id="form" class="form"><input id="host" placeholder="IP del servidor"><input id="port" value="19132" type="number"><input id="user" value="SoyPerrito" maxlength="16"><button id="connect">🔌 CONECTAR</button><div id="status" class="status">Sin conexión.</div></div><small>Bedrock · 3D · móvil + teclado</small></div></div><div id="game"><div class="hud"><span>🐶 SoyPerritoProProYT-Bed <b id="online">LOCAL</b></span><span>❤️ <b id="health">10</b></span></div><div class="cross">+</div><div class="top"><button id="inv">🎒</button><button id="sync">🌍</button><button id="chatBtn">💬</button><button id="back">☰</button></div><div class="msg" id="msg">🎮 Cargando…</div><div class="hotbar" id="hotbar"></div><div class="mobile joy" id="joy"><div class="knob" id="knob"></div></div><div class="mobile tools"><button id="jump">🦘</button><button id="brk">⛏️</button><button id="put">🧱</button></div><div class="panel" id="inventory"><button onclick="inventory.classList.remove('open')">✖️</button><h2>🎒 Inventario</h2><div class="grid" id="items"></div></div><div class="panel" id="chat"><button onclick="chat.classList.remove('open')">✖️</button><h2>💬 Chat</h2><div class="chatlog" id="log"></div><input id="chatText" placeholder="Mensaje"><button id="send">Enviar</button></div></div><script type="module">import*as T from'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const $=id=>document.getElementById(id),relay='wss://soyperritoproproyt-console-bed.onrender.com';let ws=null,remote=false,selected=0,yaw=0,pitch=0;const scene=new T.Scene(),cam=new T.PerspectiveCamera(72,innerWidth/innerHeight,.05,160),ren=new T.WebGLRenderer({antialias:false});ren.setPixelRatio(Math.min(devicePixelRatio,1.5));ren.setSize(innerWidth,innerHeight);$('game').append(ren.domElement);scene.add(new T.HemisphereLight(0xcff,0x384,1.8));const sun=new T.DirectionalLight(0xfff,2);sun.position.set(20,30,10);scene.add(sun);const geo=new T.BoxGeometry(1,1,1),meshes=new Map(),colors={grass:0x5cae3c,dirt:0x8c5a35,stone:0x777d83,wood:0x8a5a32,leaves:0x277d36,sand:0xd8c27b,water:0x3d9fd2,glass:0x8ed8ff,brick:0xa44a3d,gold:0xe0b83b,diamond:0x36d9e8,snow:0xeaf7ff,obsidian:0x302340,bedrock:0x303038},icons={grass:'🟩',dirt:'🟫',stone:'🪨',wood:'🪵',leaves:'🌿',sand:'🟨',water:'🟦',glass:'🔷',brick:'🧱',gold:'🟨',diamond:'💎',snow:'⬜',obsidian:'⬛',bedrock:'🟪'},types=Object.keys(icons);function norm(n){n=String(n).replace('minecraft:','');for(const k of types)if(n.includes(k))return k;if(n.includes('deepslate'))return'stone';if(n.includes('log'))return'wood';return'stone'}function add(x,y,z,n){const k=x+'|'+y+'|'+z;if(meshes.has(k))scene.remove(meshes.get(k));const m=new T.Mesh(geo,new T.MeshLambertMaterial({color:colors[n]||0x888888,transparent:n==='water'||n==='glass',opacity:n==='water'?.68:n==='glass'?.45:1}));m.position.set(x+.5,y+.5,z+.5);m.userData={x,y,z,n};scene.add(m);meshes.set(k,m)}function clear(){for(const m of meshes.values())scene.remove(m);meshes.clear()}function say(x){$('msg').textContent=x;clearTimeout(say.t);say.t=setTimeout(()=>$('msg').textContent=remote?'🌐 Bedrock ONLINE':'🎮 Mundo local',2500)}function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o))}function handle(m){if(m.type==='ready')$('status').textContent='🟢 Puente online';if(m.type==='connecting')say('🔄 Conectando…');if(m.type==='connected'){remote=true;$('online').textContent='ONLINE';say('🟢 Conectado al servidor real')}if(m.type==='spawn'){if(m.position)pos(m.position);send({type:'sync_world'});send({type:'inventory'})}if(m.type==='world_snapshot'){clear();for(const b of m.blocks||[])add(b.x,b.y,b.z,norm(b.name));if(m.center)pos(m.center);say('🌍 Mundo real cargado')}if(m.type==='self')pos(m.position);if(m.type==='health')$('health').textContent=m.health??10;if(m.type==='chat'){const d=document.createElement('div');d.textContent=(m.source?m.source+': ':'')+m.message;$('log').append(d);$('log').scrollTop=99999}if(m.type==='inventory'){const g=$('items');g.innerHTML='';for(const it of m.slots||[])if(it){const b=document.createElement('button');b.className='item';b.textContent=(icons[norm(it.name)]||'📦')+' '+(it.count||1);g.append(b)}}if(m.type==='error'||m.type==='action_error')say('⚠️ '+m.message);if(m.type==='disconnected'){remote=false;$('online').textContent='LOCAL';say('🔴 Desconectado')}}function pos(p){if(!p)return;cam.position.set(+p.x||0,(+p.y||0)+1.62,+p.z||0);cam.rotation.order='YXZ';cam.rotation.y=yaw;cam.rotation.x=pitch}function connect(){const h=$('host').value.trim();if(!h)return;$('status').textContent='🔄 Conectando…';$('menu').style.display='none';$('game').style.display='block';ws=new WebSocket(relay);ws.onopen=()=>send({type:'connect',host:h,port:+$('port').value||19132,username:$('user').value||'SoyPerrito',offline:true});ws.onmessage=e=>handle(JSON.parse(e.data));ws.onclose=()=>say('🔴 Conexión cerrada')}function local(){remote=false;$('menu').style.display='none';$('game').style.display='block';for(let x=-12;x<12;x++)for(let z=-12;z<12;z++){const h=3+Math.floor(Math.sin(x*.4)+Math.cos(z*.35));for(let y=0;y<=h;y++)add(x,y,z,y===h?'grass':y>h-2?'dirt':'stone')}cam.position.set(.5,6,8);say('🎮 Mundo local')}function hit(){const r=new T.Raycaster();r.setFromCamera({x:0,y:0},cam);return r.intersectObjects([...meshes.values()])[0]}function brk(){const h=hit();if(!h)return;if(remote){send({type:'break',x:h.object.userData.x,y:h.object.userData.y,z:h.object.userData.z});return}scene.remove(h.object);meshes.delete(h.object.userData.x+'|'+h.object.userData.y+'|'+h.object.userData.z)}function put(){const h=hit();if(!h)return;const b=h.object.userData,n=h.face.normal,x=b.x+Math.round(n.x),y=b.y+Math.round(n.y),z=b.z+Math.round(n.z);if(remote)send({type:'place',x:b.x,y:b.y,z:b.z,fx:Math.round(n.x),fy:Math.round(n.y),fz:Math.round(n.z)});else add(x,y,z,types[selected])}function hot(){hotbar.innerHTML='';types.slice(0,8).forEach((n,i)=>{const b=document.createElement('button');b.className='slot'+(i===selected?' sel':'');b.textContent=icons[n];b.onclick=()=>{selected=i;hot()};hotbar.append(b)})}hot();$('play').onclick=local;$('create').onclick=local;$('servers').onclick=()=>form.style.display='block';$('connect').onclick=connect;$('back').onclick=()=>{try{send({type:'disconnect'});ws?.close()}catch{}location.reload()};$('sync').onclick=()=>remote&&send({type:'sync_world'});$('inv').onclick=()=>{inventory.classList.add('open');remote&&send({type:'inventory'})};$('chatBtn').onclick=()=>chat.classList.add('open');$('brk').onclick=brk;$('put').onclick=put;$('jump').onclick=()=>remote?send({type:'controls',jump:true}):null;$('send').onclick=()=>{const x=$('chatText').value.trim();if(x){send({type:'chat',message:x});$('chatText').value=''}};addEventListener('keydown',e=>{if(e.key.toLowerCase()==='i')inventory.classList.add('open');if(/^\d$/.test(e.key)){selected=+e.key-1;hot()}if(e.key==='w'||e.key==='a'||e.key==='s'||e.key==='d')remote&&send({type:'controls',[{w:'forward',a:'left',s:'back',d:'right'}[e.key]]:true})});addEventListener('keyup',e=>{if(['w','a','s','d'].includes(e.key)&&remote)send({type:'controls',[{w:'forward',a:'left',s:'back',d:'right'}[e.key]]:false)});ren.domElement.addEventListener('mousemove',e=>{if(document.pointerLockElement===ren.domElement){yaw-=e.movementX*.0022;pitch=Math.max(-1.45,Math.min(1.45,pitch-e.movementY*.0022));if(remote)send({type:'look',yaw:yaw*180/Math.PI,pitch:pitch*180/Math.PI})}});ren.domElement.onclick=()=>ren.domElement.requestPointerLock?.();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});function loop(){ren.render(scene,cam);requestAnimationFrame(loop)}loop();</script></html>
