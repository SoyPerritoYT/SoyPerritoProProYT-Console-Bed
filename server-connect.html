<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐶 SoyPerritoProProYT-Bed · Servidor</title><style>body{margin:0;background:#101820;color:#fff;font-family:Arial,sans-serif;padding:18px}h1{margin-top:0}.card{background:#1b2935;border:2px solid #526372;border-radius:14px;padding:14px;margin:12px 0}input,button{box-sizing:border-box;width:100%;padding:12px;margin:5px 0;border-radius:9px;border:1px solid #71808d;background:#263746;color:#fff;font-size:16px}button{font-weight:bold;cursor:pointer}.ok{color:#7dff8d}.bad{color:#ff7777}.players{display:grid;gap:6px}.player{background:#263746;padding:8px;border-radius:8px}.chat{height:180px;overflow:auto;background:#0b1116;padding:8px;border-radius:8px}.line{margin:4px 0}.small{color:#aab4bd;font-size:13px}</style></head><body><h1>🐶 SoyPerritoProProYT-Bed</h1><div class="card"><b>🖥️ Conectar a servidor Bedrock</b><input id="host" placeholder="IP, por ejemplo play.ejemplo.net"><input id="port" type="number" value="19132" placeholder="Puerto"><input id="user" value="SoyPerrito" maxlength="16" placeholder="Nombre"><button id="connect">🔌 CONECTAR</button><div id="status" class="small">⚪ Sin conexión</div></div><div class="card"><h2>👥 Jugadores</h2><div id="players" class="players">Todavía no hay datos.</div></div><div class="card"><h2>💬 Chat</h2><div id="chat" class="chat"></div></div><div class="card"><h2>🌍 Mundo</h2><pre id="world">Esperando información del mundo…</pre></div><script>const WS='wss://soyperritoproproyt-console-bed.onrender.com';const $=id=>document.getElementById(id);let ws;function status(t,c=''){ $('status').textContent=t;$('status').className=c;}function line(t){const d=document.createElement('div');d.className='line';d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}function players(records){$('players').innerHTML='';if(!records.length){$('players').textContent='Sin jugadores recibidos.';return}for(const p of records){const d=document.createElement('div');d.className='player';const n=p.username||p.name||p.xbox_user_id||p.uuid||'Jugador';d.textContent='👤 '+n;$('players').appendChild(d)}}$('connect').onclick=()=>{const host=$('host').value.trim(),port=Number($('port').value),username=$('user').value.trim()||'SoyPerrito';if(!host){status('❌ Escribe la IP del servidor','bad');return}if(ws)try{ws.close()}catch{}status('🟡 Conectando…');ws=new WebSocket(WS);ws.onopen=()=>{status('🟢 Relay conectado; conectando al servidor…','ok');ws.send(JSON.stringify({type:'connect',host,port,username}))};ws.onclose=()=>status('🔴 Conexión cerrada','bad');ws.onerror=()=>status('🔴 Error del WebSocket','bad');ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='ready')status('🟢 Relay listo','ok');if(m.type==='connecting')status('🟡 Conectando a '+m.host+':'+m.port+'…');if(m.type==='connected'){status('🟢 SERVIDOR CONECTADO','ok');line('🔌 Conectado a '+m.host+':'+m.port)}if(m.type==='players')players(m.records||[]);if(m.type==='chat')line('💬 '+(m.source?m.source+': ':'')+m.message);if(m.type==='world_info'){$('world').textContent=JSON.stringify(m,null,2)}if(m.type==='world_time'){$('world').textContent='Tiempo del mundo recibido\n'+JSON.stringify(m.packet,null,2)}if(m.type==='error'){status('❌ '+m.message,'bad');line('❌ '+m.message)}if(m.type==='disconnected'){status('🔴 '+m.reason,'bad');line('🔴 '+m.reason)}}};</script></body></html>
