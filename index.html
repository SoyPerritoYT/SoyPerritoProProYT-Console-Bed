<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>🐶 SoyPerritoProProYT-Bed</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#78b9e8;font-family:Arial;color:#fff}button,input{font:inherit}button{cursor:pointer}#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(#0008,#000d),linear-gradient(135deg,#65b8ff,#237a3b)}.box{width:min(580px,90vw);padding:22px;background:#101820ee;border:2px solid #fff5;border-radius:18px;text-align:center}.box button,.box input{width:100%;box-sizing:border-box;margin:5px 0;padding:13px;border:1px solid #fff4;border-radius:9px;background:#263746;color:white}.play{background:#2f8f3a!important;font-size:20px}.form{display:none;text-align:left}.status{padding:8px;background:#0006;border-radius:8px;margin-top:6px}.hint{opacity:.75;font-size:13px}#game{display:none;position:fixed;inset:0}canvas{position:fixed;inset:0;width:100%!important;height:100%!important;touch-action:none}.hud{position:fixed;z-index:4;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}.hud span,.msg,.top button,.hotbar,.panel{background:#101820dd;border:2px solid #fff4;border-radius:9px;padding:7px}.top{position:fixed;z-index:5;right:8px;top:45px;display:flex;gap:5px}.top button{color:#fff}.msg{position:fixed;z-index:4;left:50%;bottom:80px;transform:translateX(-50%);white-space:nowrap}.hotbar{position:fixed;z-index:5;bottom:7px;left:50%;transform:translateX(-50%);display:flex;gap:4px}.slot{width:45px;height:45px;background:#263746;color:white;border:2px solid #667;border-radius:8px}.sel{border-color:#fff}.mobile{display:none;position:fixed}.joy{left:15px;bottom:20px;width:125px;height:125px;border-radius:50%;background:#0006;border:2px solid #fff5;touch-action:none;z-index:6}.knob{position:absolute;width:55px;height:55px;left:35px;top:35px;border-radius:50%;background:#fff7}.tools{right:12px;bottom:20px;flex-direction:column;gap:6px;z-index:6}.tools button{width:58px;height:58px;background:#14202dcc;color:#fff;border:1px solid #fff6;border-radius:10px;font-size:21px}.lookzone{display:none;position:fixed;inset:0 0 0 35%;z-index:2;touch-action:none}.panel{display:none;position:fixed;z-index:12;inset:8% 5%;padding:15px;overflow:auto}.panel.open{display:block}.panel button{margin:4px;padding:8px}.panel input{padding:9px;background:#263746;color:#fff;border:1px solid #fff4;border-radius:7px}.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.inv div{padding:10px;background:#263746;border-radius:6px;text-align:center}@media(pointer:coarse){.mobile{display:flex}.lookzone{display:block}}@media(max-width:600px){.hud span{font-size:12px}.hotbar{bottom:4px}.slot{width:36px;height:36px}}</style></head><body><div id="menu"><div class="box"><h1>🐶 SoyPerritoProProYT-Bed</h1><p>🌐 Mundo 3D + servidores Bedrock</p><button class="play" id="play">▶️ JUGAR MUNDO LOCAL</button><button id="servers">🖥️ SERVIDORES</button><div class="form" id="form"><input id="host" placeholder="IP / dominio del servidor Bedrock"><input id="port" type="number" value="19132" placeholder="Puerto"><input id="user" maxlength="16" value="SoyPerrito" placeholder="Nombre"><button id="connect">🔌 CONECTAR AL SERVIDOR</button><div class="status" id="status">Sin conexión</div><p class="hint">El puente conecta el navegador con Bedrock. Algunos servidores pueden exigir una versión o autenticación concreta.</p></div></div></div><div id="game"><div class="lookzone" id="lookzone"></div><div class="hud"><span>🐶 SoyPerritoProProYT-Bed · <b id="online">LOCAL</b></span><span>❤️ <b id="health">10</b></span></div><div class="top"><button id="chatBtn">💬</button><button id="invBtn">🎒</button><button id="back">☰</button></div><div class="msg" id="msg">Preparando…</div><div class="hotbar" id="hotbar"></div><div class="mobile joy" id="joy"><div class="knob" id="knob"></div></div><div class="mobile tools"><button id="jump">🦘</button><button id="break">⛏️</button><button id="place">🧱</button></div><div class="panel" id="chatPanel"><button id="closeChat">✖️</button><h3>💬 Chat</h3><div id="chatLog"></div><input id="chatText" placeholder="Mensaje"><button id="send">Enviar</button></div><div class="panel" id="invPanel"><button id="closeInv">✖️</button><h3>🎒 Inventario</h3><div class="inv" id="invGrid"></div></div></div><script type="module">import*as THREE from'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const $=id=>document.getElementById(id),RELAY='wss://soyperritoproproyt-console-bed.onrender.com';let ws=null,remote=false,connected=false,yaw=0,pitch=0,sel=0,joyActive=false,look=false,lastX=0,lastY=0;const move={forward:false,back:false,left:false,right:false,sprint:false,sneak:false,swim:false};const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,180),renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setClearColor(0x78b9e8);$('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xddeeff,0x385030,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(20,40,10);scene.add(sun);const geo=new THREE.BoxGeometry(1,1,1),meshes=new Map(),blocks=['grass','dirt','stone','wood','sand','glass','brick','gold'];const col={grass:0x5cae3c,dirt:0x8c5a35,stone:0x777d83,wood:0x8a5a32,sand:0xd8c27b,glass:0x8ed8ff,brick:0xa44a3d,gold:0xe0b83b};function add(x,y,z,n){const k=x+'|'+y+'|'+z;if(meshes.has(k))scene.remove(meshes.get(k));const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:col[n]||0x777777,transparent:n==='glass',opacity:n==='glass'?.45:1}));m.position.set(x+.5,y+.5,z+.5);m.userData={x,y,z,n};scene.add(m);meshes.set(k,m)}function removeBlock(x,y,z){const k=x+'|'+y+'|'+z,m=meshes.get(k);if(m){scene.remove(m);meshes.delete(k)}}function clear(){for(const m of meshes.values())scene.remove(m);meshes.clear()}function say(t){$('msg').textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>{$('msg').textContent=remote?'🌐 Servidor Bedrock ONLINE':'🎮 Mundo local'},2600)}function camera(){cam.rotation.order='YXZ';cam.rotation.y=yaw*Math.PI/180;cam.rotation.x=pitch*Math.PI/180}function local(){remote=false;connected=false;$('menu').style.display='none';$('game').style.display='block';$('online').textContent='LOCAL';clear();for(let x=-20;x<=20;x++)for(let z=-20;z<=20;z++){const h=3+Math.max(0,Math.floor(Math.sin(x*.32)*1.4+Math.cos(z*.27)*1.4));for(let y=0;y<=h;y++)add(x,y,z,y===h?'grass':y>=h-2?'dirt':'stone')}cam.position.set(0,7,12);yaw=0;pitch=0;camera();say('🎮 Mundo local')}function send(o){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(o))}function setPos(p){if(!p)return;const x=+p.x,y=+p.y,z=+p.z;if([x,y,z].every(Number.isFinite))cam.position.set(x,y+1.62,z)}function controlPacket(){send({type:'controls',...move})}function setMove(k,v){if(move[k]===v)return;move[k]=v;if(remote)controlPacket()}function localMove(dt){if(remote)return;let f=(move.forward?1:0)-(move.back?1:0),s=(move.right?1:0)-(move.left?1:0);if(!f&&!s)return;const len=Math.hypot(f,s)||1;f/=len;s/=len;const speed=dt*5.5,ang=yaw*Math.PI/180;cam.position.x+=(-Math.sin(ang)*f+Math.cos(ang)*s)*speed;cam.position.z+=(-Math.cos(ang)*f-Math.sin(ang)*s)*speed}function connect(){const h=$('host').value.trim();if(!h)return say('⚠️ Escribe la IP del servidor');$('menu').style.display='none';$('game').style.display='block';remote=true;connected=false;$('online').textContent='CONECTANDO';say('🔄 Conectando al servidor…');ws=new WebSocket(RELAY);ws.onopen=()=>send({type:'connect',host:h,port:+$('port').value||19132,username:$('user').value||'SoyPerrito',offline:true});ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='ready')$('status').textContent='🟢 Puente online';if(m.type==='connecting')say('🔄 Conectando a '+m.host+':'+m.port);if(m.type==='connected'){connected=true;remote=true;$('online').textContent='ONLINE';say('🟢 Servidor conectado')}if(m.type==='spawn'){setPos(m.position);send({type:'sync_world'});say('🌍 Cargando mundo del servidor…')}if(m.type==='world_snapshot'){clear();for(const b of m.blocks||[]){const n=String(b.name||'stone').replace('minecraft:','');let v=n.includes('grass')?'grass':n.includes('dirt')?'dirt':n.includes('wood')||n.includes('log')?'wood':n.includes('sand')?'sand':n.includes('glass')?'glass':n.includes('brick')?'brick':n.includes('gold')?'gold':'stone';add(b.x,b.y,b.z,v)}setPos(m.center);say('🌍 Mundo del servidor visible')}if(m.type==='self'){setPos(m.position);if(Number.isFinite(+m.yaw))yaw=+m.yaw*180/Math.PI;if(Number.isFinite(+m.pitch))pitch=+m.pitch*180/Math.PI;camera()}if(m.type==='health')$('health').textContent=m.health??10;if(m.type==='inventory')showInventory(m.slots||[]);if(m.type==='chat'){const d=document.createElement('div');d.textContent=(m.source?m.source+': ':'')+m.message;$('chatLog').append(d)}if(m.type==='error'||m.type==='action_error')say('⚠️ '+m.message);if(m.type==='disconnected'){connected=false;remote=false;$('online').textContent='OFFLINE';say('🔴 Servidor desconectado')}};ws.onerror=()=>say('❌ No se pudo conectar al puente');ws.onclose=()=>{connected=false;remote=false}}function hit(){const r=new THREE.Raycaster();r.setFromCamera({x:0,y:0},cam);return r.intersectObjects([...meshes.values()])[0]}function breakBlock(){const h=hit();if(!h)return;const b=h.object.userData;if(remote)send({type:'break',x:b.x,y:b.y,z:b.z});else removeBlock(b.x,b.y,b.z)}function placeBlock(){const h=hit();if(!h)return;const b=h.object.userData,n=h.face.normal,fx=Math.round(n.x),fy=Math.round(n.y),fz=Math.round(n.z);if(remote)send({type:'place',x:b.x,y:b.y,z:b.z,fx,fy,fz});else add(b.x+fx,b.y+fy,b.z+fz,blocks[sel])}function hot(){const h=$('hotbar');h.innerHTML='';blocks.forEach((n,i)=>{const b=document.createElement('button');b.className='slot'+(i===sel?' sel':'');b.textContent=['🟩','🟫','🪨','🪵','🟨','🔷','🧱','🟡'][i];b.onclick=()=>{sel=i;hot()};h.append(b)})}function showInventory(slots){const g=$('invGrid');g.innerHTML='';for(let i=0;i<36;i++){const s=slots[i],d=document.createElement('div');d.textContent=s?(s.displayName||s.name)+' ×'+s.count:'—';g.append(d)}}hot();$('play').onclick=local;$('servers').onclick=()=>{const f=$('form');f.style.display=f.style.display==='block'?'none':'block'};$('connect').onclick=connect;$('back').onclick=()=>location.reload();$('break').onclick=breakBlock;$('place').onclick=placeBlock;$('jump').onclick=()=>{if(remote)send({type:'controls',jump:true});else cam.position.y+=.6};$('chatBtn').onclick=()=>$('chatPanel').classList.add('open');$('invBtn').onclick=()=>{if(remote)send({type:'inventory'});$('invPanel').classList.add('open')};$('closeChat').onclick=()=>$('chatPanel').classList.remove('open');$('closeInv').onclick=()=>$('invPanel').classList.remove('open');$('send').onclick=()=>{const t=$('chatText').value.trim();if(t){send({type:'chat',message:t});$('chatText').value=''}};addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')setMove('forward',true);if(k==='s'||k==='arrowdown')setMove('back',true);if(k==='a'||k==='arrowleft')setMove('left',true);if(k==='d'||k==='arrowright')setMove('right',true);if(k==='shift')setMove('sprint',true);if(k==='control')setMove('sneak',true);if(k===' '){if(remote)send({type:'controls',jump:true});else cam.position.y+=.15}});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')setMove('forward',false);if(k==='s'||k==='arrowdown')setMove('back',false);if(k==='a'||k==='arrowleft')setMove('left',false);if(k==='d'||k==='arrowright')setMove('right',false);if(k==='shift')setMove('sprint',false);if(k==='control')setMove('sneak',false)});$('joy').addEventListener('pointerdown',e=>{e.preventDefault();joyActive=true;$('joy').setPointerCapture(e.pointerId);joyMove(e)});$('joy').addEventListener('pointermove',e=>{if(joyActive)joyMove(e)});$('joy').addEventListener('pointerup',()=>{joyActive=false;$('knob').style.transform='';['left','right','forward','back'].forEach(k=>setMove(k,false))});function joyMove(e){const r=$('joy').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,lim=43,len=Math.hypot(dx,dy);if(len>lim){dx*=lim/len;dy*=lim/len}$('knob').style.transform=`translate(${dx}px,${dy}px)`;setMove('left',dx<-15);setMove('right',dx>15);setMove('forward',dy<-15);setMove('back',dy>15)}$('lookzone').addEventListener('pointerdown',e=>{look=true;lastX=e.clientX;lastY=e.clientY;$('lookzone').setPointerCapture(e.pointerId)});$('lookzone').addEventListener('pointermove',e=>{if(!look)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.35;pitch=Math.max(-89,Math.min(89,pitch-dy*.35));camera();if(remote)send({type:'look',yaw,pitch})});$('lookzone').addEventListener('pointerup',()=>look=false);renderer.domElement.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.2;pitch=Math.max(-89,Math.min(89,pitch-e.movementY*.2));camera();if(remote)send({type:'look',yaw,pitch})}});renderer.domElement.addEventListener('click',()=>renderer.domElement.requestPointerLock?.());let last=performance.now(),controlTick=0;function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;localMove(dt);if(remote&&connected&&now-controlTick>100){controlTick=now;controlPacket()}renderer.render(scene,cam);requestAnimationFrame(loop)}addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});requestAnimationFrame(loop);</script></body></html>
