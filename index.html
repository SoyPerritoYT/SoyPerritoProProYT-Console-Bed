<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🐶 SoyPerritoProProYT-Bed</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10141b;color:#fff;font-family:Arial,sans-serif}main{max-width:1050px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.top h1{margin:5px 0;font-size:25px}.hud{background:#1d2633;border:2px solid #354457;border-radius:12px;padding:8px;font-weight:bold}.game{position:relative;background:#18202a;border:3px solid #394858;border-radius:16px;padding:8px}.wrap{position:relative}.world{display:block;width:100%;height:auto;background:#79cfff;border-radius:10px;image-rendering:pixelated;touch-action:none}.msg{min-height:24px;text-align:center;font-weight:bold}.controls{display:grid;grid-template-columns:repeat(3,62px);gap:6px;justify-content:center;margin:8px}.controls button,.actions button{min-height:52px;border:0;border-radius:12px;background:#303b4a;color:#fff;font-size:20px;font-weight:bold}.actions{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.actions button{padding:10px 14px;font-size:14px}.inventory{margin-top:8px;background:#111820;border-radius:12px;padding:8px}.slots{display:flex;gap:5px;flex-wrap:wrap}.slot{width:55px;height:55px;border:2px solid #56677a;border-radius:8px;background:#26313e;color:#fff;font-size:25px}.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.skin{padding:9px;border:0;border-radius:10px;background:#293544;color:#fff;font-size:22px}.free{display:block;font-size:11px;margin-top:2px}.hint{opacity:.8;font-size:13px;text-align:center}@media(max-width:600px){.skins{grid-template-columns:repeat(2,1fr)}.top h1{font-size:20px}}
</style>
</head>
<body><main>
<div class="top"><h1>🐶 SoyPerritoProProYT-Bed</h1><div class="hud">❤️ <span id="hp">10</span>/10 &nbsp; 🪙 <span id="coins">0</span> &nbsp; 🧱 <span id="blocks">12</span></div></div>
<div class="game"><div class="wrap"><canvas id="world" class="world" width="960" height="540"></canvas></div>
<div class="controls"><span></span><button data-key="ArrowUp">⬆️</button><span></span><button data-key="ArrowLeft">⬅️</button><button id="mine">⛏️</button><button data-key="ArrowRight">➡️</button><span></span><button data-key="ArrowDown">⬇️</button><span></span></div>
<div class="actions"><button id="mine2">⛏️ ROMPER</button><button id="place">🧱 COLOCAR</button><button id="attack">⚔️ ATACAR</button><button id="eat">🍎 COMER</button><button id="save">💾 GUARDAR</button><button id="load">📂 CARGAR</button><button id="new">🔄 NUEVO MUNDO</button></div>
<p class="msg" id="msg">🎮 Explora el mundo, consigue bloques y derrota a los enemigos.</p>
<div class="inventory"><b>🎒 INVENTARIO</b><div class="slots" id="slots"></div></div>
<h3>👕 8 SKINS GRATIS</h3><div class="skins" id="skins"></div><p class="hint">⌨️ Flechas/WASD para moverte · ESPACIO para atacar · E para romper</p>
</div></main>
<script>
const c=document.getElementById('world'),ctx=c.getContext('2d'),W=c.width,H=c.height;
let player={x:480,y:330,hp:10,skin:0};let coins=0,blocks=12,day=0,enemy={x:730,y:330,hp:5,alive:true};
const skins=['🐶','🐶🎮','🐶🧢','🐶⭐','🐶🕶️','🐶👑','🐶💻','🐶🚀'];
const items=[['🟫','Tierra'],['🟩','Hierba'],['🪨','Piedra'],['🪵','Madera'],['💎','Cristal']];
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function say(t){document.getElementById('msg').textContent=t}
function renderHUD(){document.getElementById('hp').textContent=player.hp;document.getElementById('coins').textContent=coins;document.getElementById('blocks').textContent=blocks}
function rect(x,y,w,h,fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h)}
function drawBlock(x,y,type){let colors=['#8b5a35','#57a63d','#777b82','#8a5a32','#55c9d9'];rect(x,y,40,40,colors[type]);ctx.strokeStyle='rgba(0,0,0,.25)';ctx.strokeRect(x,y,40,40);if(type===1){rect(x,y,40,8,'#6fd04c')}if(type===3){rect(x+8,y,5,40,'#704523');rect(x+28,y,5,40,'#704523')}}
function draw(){
 let night=(Math.floor(day)%2)===1;ctx.clearRect(0,0,W,H);rect(0,0,W,H,night?'#18233e':'#79cfff');
 ctx.fillStyle=night?'#f0f3ff':'#ffe47a';ctx.beginPath();ctx.arc(night?820:120,90,night?28:38,0,Math.PI*2);ctx.fill();
 rect(0,350,W,190,night?'#244d2c':'#55a63e');
 for(let x=0;x<W;x+=40){let t=((x/40+Math.floor(day))%5===0)?2:1;drawBlock(x,350,t);drawBlock(x,390,0);drawBlock(x,430,2);drawBlock(x,470,0);}
 // árboles
 for(const tx of [100,280,650,870]){rect(tx,285,24,65,'#704523');ctx.fillStyle='#247a35';ctx.beginPath();ctx.arc(tx+12,270,45,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(tx-15,292,30,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(tx+40,292,30,0,Math.PI*2);ctx.fill()}
 // piedras y flores
 for(const px of [190,390,560,800]){ctx.fillStyle='#737982';ctx.beginPath();ctx.arc(px,335,15,0,Math.PI*2);ctx.fill()}
 for(const fx of [60,350,590,940]){ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.arc(fx,335,5,0,Math.PI*2);ctx.fill()}
 // enemigo
 if(enemy.alive){ctx.fillStyle='#a43d3d';ctx.beginPath();ctx.arc(enemy.x,enemy.y,25,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(enemy.x-14,enemy.y-8,8,8);ctx.fillRect(enemy.x+6,enemy.y-8,8,8);ctx.fillStyle='#111';ctx.fillRect(enemy.x-12,enemy.y-6,4,4);ctx.fillRect(enemy.x+8,enemy.y-6,4,4);ctx.fillStyle='#222';ctx.fillRect(enemy.x-18,enemy.y-35,36,5);ctx.fillStyle='#65e26c';ctx.fillRect(enemy.x-18,enemy.y-35,36*(enemy.hp/5),5)}
 // player
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(player.x,player.y,24,0,Math.PI*2);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(player.x-18,player.y-26,10,12);ctx.fillRect(player.x+8,player.y-26,10,12);ctx.fillStyle='#333';ctx.fillRect(player.x-12,player.y-5,7,7);ctx.fillRect(player.x+5,player.y-5,7,7);ctx.fillStyle='#d88a66';ctx.fillRect(player.x-7,player.y+9,14,5);
 // skin badge
 ctx.font='22px Arial';ctx.textAlign='center';ctx.fillText(skins[player.skin],player.x,player.y-35);ctx.textAlign='left';
 renderHUD();
}
function move(dx,dy){player.x=clamp(player.x+dx,30,W-30);player.y=clamp(player.y+dy,220,500);if(enemy.alive&&Math.hypot(enemy.x-player.x,enemy.y-player.y)<55){player.hp--;enemy.x+=enemy.x>player.x?35:-35;if(player.hp<=0){player.hp=10;player.x=480;player.y=330;say('💥 Te derrotaron. Has reaparecido.')}}draw()}
function mine(){if(blocks<1){say('❌ No tienes bloques para usar.');return}blocks--;coins++;say('⛏️ Has roto un bloque y encontrado una moneda.');draw()}
function place(){if(blocks<=0){say('❌ No tienes bloques.');return}blocks--;say('🧱 ¡Bloque colocado!');draw()}
function attack(){if(!enemy.alive){say('🏆 Ya derrotaste al enemigo.');return}if(Math.hypot(enemy.x-player.x,enemy.y-player.y)<100){enemy.hp--;say(enemy.hp?'⚔️ ¡Golpe!':'💥 ¡Enemigo derrotado!');if(enemy.hp<=0){enemy.alive=false;coins+=5;blocks+=5;say('🏆 ¡Enemigo derrotado! +5 monedas y +5 bloques.')}}else say('⚔️ Acércate más para atacar.');draw()}
function eat(){if(player.hp<10){player.hp=clamp(player.hp+3,0,10);say('🍎 Has recuperado vida.')}else say('❤️ Ya tienes la vida completa.');draw()}
function save(){localStorage.setItem('spbed-real',JSON.stringify({player,coins,blocks,day,enemy}));say('💾 Partida guardada.');}
function load(){let s=JSON.parse(localStorage.getItem('spbed-real')||'null');if(!s){say('❌ No hay partida guardada.');return}player=s.player;coins=s.coins;blocks=s.blocks;day=s.day;enemy=s.enemy;draw();say('📂 Partida cargada.')}
function newWorld(){player={x:480,y:330,hp:10,skin:player.skin};coins=0;blocks=12;day=0;enemy={x:730,y:330,hp:5,alive:true};say('🌍 ¡Nuevo mundo creado!');draw()}
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let k=b.dataset.key;if(k==='ArrowUp')move(0,-28);if(k==='ArrowDown')move(0,28);if(k==='ArrowLeft')move(-28,0);if(k==='ArrowRight')move(28,0)});
document.getElementById('mine').onclick=mine;document.getElementById('mine2').onclick=mine;document.getElementById('place').onclick=place;document.getElementById('attack').onclick=attack;document.getElementById('eat').onclick=eat;document.getElementById('save').onclick=save;document.getElementById('load').onclick=load;document.getElementById('new').onclick=newWorld;
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')move(0,-28);if(e.key==='ArrowDown'||e.key==='s')move(0,28);if(e.key==='ArrowLeft'||e.key==='a')move(-28,0);if(e.key==='ArrowRight'||e.key==='d')move(28,0);if(e.key===' '){e.preventDefault();attack()}if(e.key.toLowerCase()==='e')mine()});
for(const [icon,name] of items){let d=document.createElement('button');d.className='slot';d.title=name;d.textContent=icon;document.getElementById('slots').appendChild(d)}
skins.forEach((s,i)=>{let b=document.createElement('button');b.className='skin';b.innerHTML=s+'<span class="free">🆓 GRATIS</span>';b.onclick=()=>{player.skin=i;day+=.1;say('👕 Skin '+(i+1)+' equipada.');draw()};document.getElementById('skins').appendChild(b)});
setInterval(()=>{day+=.05;draw()},4000);draw();
</script></body></html>
