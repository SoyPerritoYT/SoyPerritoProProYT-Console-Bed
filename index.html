ght,.05,100),renderer=new THREE.WebGLRenderer({antialias:false});scene.background=new THREE.Color(0x82d3ff);scene.fog=new THREE.Fog(0x82d3ff,22,70);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;$('game').appendChild(renderer.domElement);const hemi=new THREE.HemisphereLight(0xbfeeff,0x426b3d,1.7);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffffff,2);scene.add(sun);const cube=new THREE.BoxGeometry(1,1,1),mat={grass:new THREE.MeshLambertMaterial({color:0x5cae3c}),dirt:new THREE.MeshLambertMaterial({color:0x8c5a35}),stone:new THREE.MeshLambertMaterial({color:0x777d83}),wood:new THREE.MeshLambertMaterial({color:0x8a5a32}),leaves:new THREE.MeshLambertMaterial({color:0x277d36}),sand:new THREE.MeshLambertMaterial({color:0xd8c27b}),water:new THREE.MeshLambertMaterial({color:0x3d9fd2,transparent:true,opacity:.68})};const types=['grass','dirt','stone','wood','sand','water'],icons=['🟩','🟫','🪨','🪵','🟨','🟦'],world=new Map(),meshes=new Map(),K=(x,y,z)=>x+'|'+y+'|'+z;let selected=0,coins=0,hp=10,worldTime=0;function mesh(x,y,z,t){const k=K(x,y,z),m=new THREE.Mesh(cube,mat[t]||mat.grass);m.position.set(x+.5,y+.5,z+.5);m.userData.block={x,y,z,type:t};scene.add(m);meshes.set(k,m)}function add(x,y,z,t){if(y>=0&&y<=15){world.set(K(x,y,z),t);mesh(x,y,z,t)}}function clear(){for(const m of meshes.values())scene.remove(m);meshes.clear()}function heightAt(x,z){return Math.max(1,Math.floor(3+Math.sin(x*.42)*.8+Math.cos(z*.37)*.8+Math.sin((x+z)*.2)*.6))}function makeWorld(){world.clear();clear();for(let x=-18;x<18;x++)for(let z=-18;z<18;z++){const h=heightAt(x,z);for(let y=0;y<=h;y++)add(x,y,z,y===h?'grass':y>h-3?'dirt':'stone');if((x*17+z*31)%43===0&&h<7){for(let y=1;y<=3;y++)add(x,h+y,z,'wood');for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=2;dy<=4;dy++)if(Math.abs(dx)+Math.abs(dz)+dy<7)add(x+dx,h+dy,z+dz,'leaves')}}}makeWorld();const player={p:new THREE.Vector3(.5,heightAt(0,6)+1.05,6.5),v:new THREE.Vector3(),yaw:0,pitch:0,ground:false},keys={w:false,a:false,s:false,d:false};let locked=false;function updateHUD(){$('hp').textContent=hp;$('coins').textContent=coins;$('blocks').textContent=world.size}function say(t){$('msg').textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>$('msg').textContent='🌳 Explora, rompe y construye tu mundo 3D.',2200)}function jump(){if(player.ground){player.v.y=7;player.ground=false}}function solid(x,y,z){return world.has(K(Math.floor(x),Math.floor(y),Math.floor(z)))}function collide(p){const r=.27;for(let x=Math.floor(p.x-r);x<=Math.floor(p.x+r);x++)for(let z=Math.floor(p.z-r);z<=Math.floor(p.z+r);z++)for(let y=Math.floor(p.y-1.65);y<=Math.floor(p.y+.05);y++)if(solid(x,y,z))return true;return false}function update(dt){const speed=5.4,f=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw)),r=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw)),dir=new THREE.Vector3();if(keys.w)dir.add(f);if(keys.s)dir.sub(f);if(keys.d)dir.add(r);if(keys.a)dir.sub(r);if(dir.lengthSq())dir.normalize().multiplyScalar(speed*dt);let q=player.p.clone();q.x+=dir.x;if(!collide(q))player.p.x=q.x;q=player.p.clone();q.z+=dir.z;if(!collide(q))player.p.z=q.z;player.v.y-=18*dt;q=player.p.clone();q.y+=player.v.y*dt;if(!collide(q)){player.p.y=q.y;player.ground=false}else{if(player.v.y<0)player.ground=true;player.v.y=0}if(player.p.y<-5){player.p.set(.5,heightAt(0,6)+1.05,6.5);player.v.set(0,0,0)}camera.position.set(player.p.x,player.p.y+1.65,player.p.z);camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch}renderer.domElement.addEventListener('click',()=>{if(innerWidth>700)renderer.domElement.requestPointerLock?.()});document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);document.addEventListener('mousemove',e=>{if(locked){player.yaw-=e.movementX*.0022;player.pitch=Math.max(-1.45,Math.min(1.45,player.pitch-e.movementY*.0022))}});addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k in keys)keys[k]=true;if(e.code==='Space'){e.preventDefault();jump()}if(/^\d$/.test(e.key)){const n=+e.key-1;if(n<6){selected=n;hotbar()}}});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k in keys)keys[k]=false});const ray=new THREE.Raycaster();function hit(){ray.setFromCamera(new THREE.Vector2(0,0),camera);const a=ray.intersectObjects([...meshes.values()]);return a[0]&&a[0].distance<=7?a[0]:null}function breakBlock(){const h=hit();if(!h){say('⛏️ Mira a un bloque');return}const b=h.object.userData.block;if(b.y===0)return;world.delete(K(b.x,b.y,b.z));scene.remove(h.object);meshes.delete(K(b.x,b.y,b.z));coins++;updateHUD()}function placeBlock(){const h=hit();if(!h){say('🧱 Mira a un bloque');return}const b=h.object.userData.block,n=h.face.normal,x=b.x+Math.round(n.x),y=b.y+Math.round(n.y),z=b.z+Math.round(n.z);if(y<0||y>15||world.has(K(x,y,z)))return;add(x,y,z,types[selected]);updateHUD()}$('break').onclick=breakBlock;$('place').onclick=placeBlock;$('jump').onclick=jump;renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){if(e.button===0)breakBlock();if(e.button===2)placeBlock()}});renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());function hotbar(){const h=$('hotbar');h.innerHTML='';types.forEach((t,i)=>{const b=document.createElement('button');b.className='slot'+(i===selected?' sel':'');b.textContent=icons[i];b.onclick=()=>{selected=i;hotbar()};h.appendChild(b)})}hotbar();const joy=$('joy'),knob=$('joyknob');let joyActive=false,joyId=null;function joyReset(){joyActive=false;joyId=null;knob.style.transform='translate(0,0)';keys.w=keys.a=keys.s=keys.d=false}function joyMove(e){if(!joyActive||e.pointerId!==joyId)return;e.preventDefault();const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=42,len=Math.hypot(dx,dy),scale=len>max?max/len:1,x=dx*scale,y=dy*scale;knob.style.transform=`translate(${x}px,${y}px)`;const dead=10;keys.w=y<-dead;keys.s=y>dead;keys.a=x<-dead;keys.d=x>dead}joy.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();joyActive=true;joyId=e.pointerId;joy.setPointerCapture?.(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',joyMove,{passive:false});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>joy.addEventListener(ev,e=>{e.preventDefault();joyReset()},{passive:false}));let lookId=null,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture?.(e.pointerId)}},{passive:true});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerType==='touch'&&e.pointerId===lookId){const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;player.yaw-=dx*.006;player.pitch=Math.max(-1.45,Math.min(1.45,player.pitch-dy*.006))}},{passive:true});function endLook(e){if(e.pointerId===lookId)lookId=null}renderer.domElement.addEventListener('pointerup',endLook);renderer.domElement.addEventListener('pointercancel',endLook);function save(){localStorage.setItem('spbed3d',JSON.stringify({blocks:[...world],p:[player.p.x,player.p.y,player.p.z],yaw:player.yaw,pitch:player.pitch,coins,hp}));say('💾 Mundo guardado')}function load(){try{const d=JSON.parse(localStorage.getItem('spbed3d')||'null');if(!d)return;world.clear();clear();for(const [k,t] of d.blocks){const [x,y,z]=k.split('|').map(Number);add(x,y,z,t)}player.p.set(...d.p);player.yaw=d.yaw;player.pitch=d.pitch;coins=d.coins;hp=d.hp;updateHUD();say('📂 Mundo cargado')}catch{say('❌ Error al cargar')}}$('save').onclick=save;$('load').onclick=load;$('new').onclick=()=>{if(confirm('¿Crear un mundo nuevo?')){makeWorld();player.p.set(.5,heightAt(0,6)+1.05,6.5);player.v.set(0,0,0);coins=0;hp=10;updateHUD()}};let last=performance.now();function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;worldTime+=dt*.25;const daylight=(Math.sin(worldTime)+1)/2;sun.position.set(Math.cos(worldTime)*28,8+daylight*25,Math.sin(worldTime)*28);sun.intensity=.45+daylight*1.8;hemi.intensity=.7+daylight*1.1;const sky=new THREE.Color().setHSL(.56,.75,.48+daylight*.2);scene.background=sky;scene.fog.color=sky;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});updateHUD();say('🎮 Joystick para moverte · arrastra la pantalla para mirar');requestAnimationFrame(loop);</script></body></html>
