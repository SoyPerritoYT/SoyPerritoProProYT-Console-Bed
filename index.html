<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>🐶 SoyPerritoProProYT-Bed 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7bcfff;font-family:Arial,sans-serif;color:#fff}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}.box{background:#101820d9;border:2px solid #ffffff44;border-radius:12px;padding:8px 10px;font-weight:bold;text-shadow:1px 2px #000}.title{font-size:18px}.stats{font-size:14px}.cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:25px;text-shadow:0 2px 3px #000;pointer-events:none;z-index:4}.msg{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000b;padding:8px 12px;border-radius:10px;z-index:6}.topbuttons{position:fixed;right:10px;top:58px;display:flex;gap:5px;z-index:7}.topbuttons button,.tools button{border:0;border-radius:9px;background:#14202dcc;color:#fff;padding:9px;font-weight:bold}.hotbar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:#101820cc;padding:6px;border:2px solid #77818c;border-radius:12px;z-index:6}.slot{width:52px;height:52px;border:2px solid #65717c;border-radius:8px;background:#26313c;color:#fff;font-size:23px}.slot.sel{border-color:#fff;box-shadow:0 0 0 2px #ffd84d inset}.mobile{display:none;position:fixed;z-index:8;touch-action:none;user-select:none;-webkit-user-select:none}.dpad{left:14px;bottom:16px;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px 54px;gap:5px}.dpad button,.tools button{width:54px;height:54px;border:1px solid #aab4bd;border-radius:11px;background:#14202dcc;color:#fff;font-size:20px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}.dpad .u{grid-column:2}.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.tools{right:14px;bottom:16px;display:flex;flex-direction:column;gap:5px}.help{position:fixed;left:10px;bottom:10px;background:#0008;padding:5px 8px;border-radius:7px;font-size:12px;z-index:5}@media(pointer:coarse){.mobile{display:grid}.help{display:none}.hotbar{bottom:8px}.msg{bottom:75px}.topbuttons{top:8px}.title{font-size:14px}.stats{font-size:12px}}@media(max-width:650px){.slot{width:44px;height:44px;font-size:19px}.box{padding:6px}.title{max-width:55vw;white-space:nowrap;overflow:hidden}}</style></head><body><div id="game"></div><div class="hud"><div class="box title">🐶 SoyPerritoProProYT-Bed 3D</div><div class="box stats">❤️ <span id="hp">10</span> &nbsp; 🪙 <span id="coins">0</span> &nbsp; 🧱 <span id="blocks">0</span></div></div><div class="cross">+</div><div class="topbuttons"><button id="save">💾</button><button id="load">📂</button><button id="new">🌍</button></div><div class="msg" id="msg">Cargando mundo 3D…</div><div class="hotbar" id="hotbar"></div><div class="mobile dpad"><button type="button" class="u" data-key="w">⬆️</button><button type="button" class="l" data-key="a">⬅️</button><button type="button" class="d" data-key="s">⬇️</button><button type="button" class="r" data-key="d">➡️</button></div><div class="mobile tools"><button type="button" id="jump">🦘</button><button type="button" id="break">⛏️</button><button type="button" id="place">🧱</button></div><div class="help">WASD · ratón · ESPACIO · clic izq rompe · clic der coloca · 1-6 bloques</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const $=id=>document.getElementById(id);const scene=new THREE.Scene();scene.background=new THREE.Color(0x82d3ff);scene.fog=new THREE.Fog(0x82d3ff,22,70);const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,100);const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;$('game').appendChild(renderer.domElement);const hemi=new THREE.HemisphereLight(0xbfeeff,0x426b3d,1.7);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffffff,2);scene.add(sun);const cube=new THREE.BoxGeometry(1,1,1);const mat={grass:new THREE.MeshLambertMaterial({color:0x5cae3c}),dirt:new THREE.MeshLambertMaterial({color:0x8c5a35}),stone:new THREE.MeshLambertMaterial({color:0x777d83}),wood:new THREE.MeshLambertMaterial({color:0x8a5a32}),leaves:new THREE.MeshLambertMaterial({color:0x277d36}),sand:new THREE.MeshLambertMaterial({color:0xd8c27b}),water:new THREE.MeshLambertMaterial({color:0x3d9fd2,transparent:true,opacity:.68})};const types=['grass','dirt','stone','wood','sand','water'],icons=['🟩','🟫','🪨','🪵','🟨','🟦'];const world=new Map(),meshes=new Map(),K=(x,y,z)=>x+'|'+y+'|'+z;let selected=0,coins=0,hp=10,worldTime=0;function mesh(x,y,z,t){const k=K(x,y,z),m=new THREE.Mesh(cube,mat[t]||mat.grass);m.position.set(x+.5,y+.5,z+.5);m.userData.block={x,y,z,type:t};scene.add(m);meshes.set(k,m)}function add(x,y,z,t){if(y>=0&&y<=15){world.set(K(x,y,z),t);mesh(x,y,z,t)}}function clear(){for(const m of meshes.values())scene.remove(m);meshes.clear()}function heightAt(x,z){return Math.max(1,Math.floor(3+Math.sin(x*.42)*.8+Math.cos(z*.37)*.8+Math.sin((x+z)*.2)*.6))}function makeWorld(){world.clear();clear();for(let x=-18;x<18;x++)for(let z=-18;z<18;z++){let h=heightAt(x,z);for(let y=0;y<=h;y++)add(x,y,z,y===h?'grass':y>h-3?'dirt':'stone');if((x*17+z*31)%43===0&&h<7){for(let y=1;y<=3;y++)add(x,h+y,z,'wood');for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=2;dy<=4;dy++)if(Math.abs(dx)+Math.abs(dz)+dy<7)add(x+dx,h+dy,z+dz,'leaves')}}}makeWorld();const player={p:new THREE.Vector3(0,heightAt(0,6)+1.02,6),v:new THREE.Vector3(),yaw:0,pitch:0,ground:false};const keys={w:false,a:false,s:false,d:false};let locked=false;function updateHUD(){$('hp').textContent=hp;$('coins').textContent=coins;$('blocks').textContent=world.size}function say(t){$('msg').textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>$('msg').textContent='🌳 Explora, rompe y construye tu mundo 3D.',2200)}function jump(){if(player.ground){player.v.y=7;player.ground=false}}function solid(x,y,z){return world.has(K(Math.floor(x),Math.floor(y),Math.floor(z)))}function collide(p){const r=.28;for(let x=Math.floor(p.x-r);x<=Math.floor(p.x+r);x++)for(let z=Math.floor(p.z-r);z<=Math.floor(p.z+r);z++)for(let y=Math.floor(p.y-1.65);y<=Math.floor(p.y+.1);y++)if(solid(x,y,z))return true;return false}function update(dt){const speed=5.4;const f=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw)),r=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw)),dir=new THREE.Vector3();if(keys.w)dir.add(f);if(keys.s)dir.sub(f);if(keys.d)dir.add(r);if(keys.a)dir.sub(r);if(dir.lengthSq())dir.normalize().multiplyScalar(speed*dt);let q=player.p.clone();q.x+=dir.x;if(!collide(q))player.p.x=q.x;q=player.p.clone();q.z+=dir.z;if(!collide(q))player.p.z=q.z;player.v.y-=18*dt;q=player.p.clone();q.y+=player.v.y*dt;if(!collide(q)){player.p.y=q.y;player.ground=false}else{if(player.v.y<0)player.ground=true;player.v.y=0}if(player.p.y<-5){player.p.set(0,heightAt(0,6)+1.02,6);player.v.set(0,0,0)}camera.position.set(player.p.x,player.p.y+1.65,player.p.z);camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch}
renderer.domElement.addEventListener('click',()=>{if(innerWidth>700)renderer.domElement.requestPointerLock?.()});document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);document.addEventListener('mousemove',e=>{if(locked){player.yaw-=e.movementX*.0022;player.pitch=Math.max(-1.45,Math.min(1.45,player.pitch-e.movementY*.0022))}});addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k in keys)keys[k]=true;if(e.code==='Space'){e.preventDefault();jump()}if(/^\d$/.test(e.key)){const n=+e.key-1;if(n<6){selected=n;hotbar()}}});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k in keys)keys[k]=false});
const ray=new THREE.Raycaster();function hit(){ray.setFromCamera(new THREE.Vector2(0,0),camera);const a=ray.intersectObjects([...meshes.values()]);return a[0]&&a[0].distance<=7?a[0]:null}function breakBlock(){const h=hit();if(!h){say('⛏️ Mira a un bloque');return}const b=h.object.userData.block;if(b.y===0)return;world.delete(K(b.x,b.y,b.z));scene.remove(h.object);meshes.delete(K(b.x,b.y,b.z));coins++;updateHUD()}function placeBlock(){const h=hit();if(!h){say('🧱 Mira a un bloque');return}const b=h.object.userData.block,n=h.face.normal,x=b.x+Math.round(n.x),y=b.y+Math.round(n.y),z=b.z+Math.round(n.z);if(y<0||y>15||world.has(K(x,y,z)))return;add(x,y,z,types[selected]);updateHUD()}$('break').onclick=breakBlock;$('place').onclick=placeBlock;$('jump').onclick=jump;renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){if(e.button===0)breakBlock();if(e.button===2)placeBlock()}});renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
function hotbar(){const h=$('hotbar');h.innerHTML='';types.forEach((t,i)=>{const b=document.createElement('button');b.className='slot'+(i===selected?' sel':'');b.textContent=icons[i];b.onclick=()=>{selected=i;hotbar()};h.appendChild(b)})}hotbar();
function bindDirection(btn){const k=btn.dataset.key;const start=e=>{e.preventDefault();e.stopPropagation();btn.setPointerCapture?.(e.pointerId);keys[k]=true};const stop=e=>{e.preventDefault();e.stopPropagation();keys[k]=false};btn.addEventListener('pointerdown',start,{passive:false});btn.addEventListener('pointerup',stop,{passive:false});btn.addEventListener('pointercancel',stop,{passive:false});btn.addEventListener('lostpointercapture',stop,{passive:false});btn.addEventListener('pointerleave',stop,{passive:false});}document.querySelectorAll('[data-key]').forEach(bindDirection);
function save(){localStorage.setItem('spbed3d',JSON.stringify({blocks:[...world],p:[player.p.x,player.p.y,player.p.z],yaw:player.yaw,pitch:player.pitch,coins,hp}));say('💾 Mundo guardado')}function load(){try{const d=JSON.parse(localStorage.getItem('spbed3d')||'null');if(!d)return;world.clear();clear();for(const [k,t] of d.blocks){const [x,y,z]=k.split('|').map(Number);add(x,y,z,t)}player.p.set(...d.p);player.yaw=d.yaw;player.pitch=d.pitch;coins=d.coins;hp=d.hp;updateHUD();say('📂 Mundo cargado')}catch{say('❌ Error al cargar')}}$('save').onclick=save;$('load').onclick=load;$('new').onclick=()=>{if(confirm('¿Crear un mundo nuevo?')){makeWorld();player.p.set(0,heightAt(0,6)+1.02,6);player.v.set(0,0,0);coins=0;hp=10;updateHUD()}};let last=performance.now();function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;worldTime+=dt*.25;const daylight=(Math.sin(worldTime)+1)/2;sun.position.set(Math.cos(worldTime)*28,8+daylight*25,Math.sin(worldTime)*28);sun.intensity=.45+daylight*1.8;hemi.intensity=.7+daylight*1.1;const sky=new THREE.Color().setHSL(.56,.75,.48+daylight*.2);scene.background=sky;scene.fog.color=sky;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});updateHUD();say('🌳 Explora, rompe y construye tu mundo 3D.');requestAnimationFrame(loop);
</script></body></html>
