<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>🐶 SoyPerritoProProYT-Bed</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#78b9e8;font-family:Arial;color:#fff}button,input{font:inherit}button{cursor:pointer}#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(#0008,#000c),linear-gradient(135deg,#65b8ff,#237a3b)}.box{width:min(560px,90vw);padding:22px;background:#101820ee;border:2px solid #fff5;border-radius:18px;text-align:center}.box button,.box input{width:100%;box-sizing:border-box;margin:5px 0;padding:13px;border:1px solid #fff4;border-radius:9px;background:#263746;color:white}.play{background:#2f8f3a!important;font-size:20px}.form{display:none;text-align:left}.status{padding:8px;background:#0006;border-radius:8px}#game{display:none;position:fixed;inset:0}canvas{position:fixed;inset:0;width:100%!important;height:100%!important;touch-action:none}.hud{position:fixed;z-index:3;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}.hud span,.msg,.top button,.hotbar{background:#101820dd;border:2px solid #fff4;border-radius:9px;padding:7px}.top{position:fixed;z-index:4;right:8px;top:45px;display:flex;gap:5px}.top button{color:#fff}.msg{position:fixed;z-index:4;left:50%;bottom:80px;transform:translateX(-50%)}.hotbar{position:fixed;z-index:4;bottom:7px;left:50%;transform:translateX(-50%);display:flex;gap:4px}.slot{width:45px;height:45px;background:#263746;color:white;border:2px solid #667;border-radius:8px}.sel{border-color:#fff}.mobile{display:none;position:fixed;z-index:5}.joy{left:15px;bottom:20px;width:125px;height:125px;border-radius:50%;background:#0006;border:2px solid #fff5;touch-action:none}.knob{position:absolute;width:55px;height:55px;left:35px;top:35px;border-radius:50%;background:#fff7}.tools{right:12px;bottom:20px;flex-direction:column;gap:6px}.tools button{width:58px;height:58px;background:#14202dcc;color:#fff;border:1px solid #fff6;border-radius:10px;font-size:21px}.lookzone{display:none;position:fixed;inset:0 0 0 35%;z-index:2;touch-action:none}@media(pointer:coarse){.mobile{display:flex}.lookzone{display:block}}.panel{display:none;position:fixed;z-index:9;inset:8% 5%;padding:15px;background:#101820ee;border:2px solid #fff5;border-radius:12px}.panel.open{display:block}</style></head><body><div id="menu"><div class="box"><h1>🐶 SoyPerritoProProYT-Bed</h1><p>🌐 Mundo 3D + servidores Bedrock</p><button class="play" id="play">▶️ JUGAR</button><button id="servers">🖥️ SERVIDORES</button><button id="create">🌍 MUNDO LOCAL</button><div class="form" id="form"><input id="host" placeholder="IP del servidor Bedrock"><input id="port" type="number" value="19132"><input id="user" maxlength="16" value="SoyPerrito"><button id="connect">🔌 CONECTAR AL SERVIDOR</button><div class="status" id="status">Sin conexión</div></div></div></div><div id="game"><div class="lookzone" id="lookzone"></div><div class="hud"><span>🐶 SoyPerritoProProYT-Bed <b id="online">LOCAL</b></span><span>❤️ <b id="health">10</b></span></div><div class="top"><button id="back">☰</button></div><div class="msg" id="msg">Preparando…</div><div class="hotbar" id="hotbar"></div><div class="mobile joy" id="joy"><div class="knob" id="knob"></div></div><div class="mobile tools"><button id="jump">🦘</button><button id="break">⛏️</button><button id="place">🧱</button></div><div class="panel" id="chatPanel"><button id="closeChat">✖️</button><h3>💬 Chat</h3><div id="chatLog"></div><input id="chatText" placeholder="Mensaje"><button id="send">Enviar</button></div></div><script type="module">import*as THREE from'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const $=id=>document.getElementById(id),RELAY='wss://soyperritoproproyt-console-bed.onrender.com';let ws=null,remote=false,move={forward:false,back:false,left:false,right:false},yaw=0,pitch=0,sel=0,joyActive=false,joyCenter={x:0,y:0};const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,160),renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setClearColor(0x78b9e8);$('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xddeeff,0x385030,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(20,40,10);scene.add(sun);const geo=new THREE.BoxGeometry(1,1,1),meshes=new Map(),blocks=['grass','dirt','stone','wood','sand','glass','brick','gold'];const col={grass:0x5cae3c,dirt:0x8c5a35,stone:0x777d83,wood:0x8a5a32,sand:0xd8c27b,glass:0x8ed8ff,brick:0xa44a3d,gold:0xe0b83b};function add(x,y,z,n){const k=x+'|'+y+'|'+z,m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:col[n]||0x777777,transparent:n==='glass',opacity:n==='glass'?.45:1}));m.position.set(x+.5,y+.5,z+.5);m.userData={x,y,z,n};scene.add(m);meshes.set(k,m)}function clear(){for(const m of meshes.values())scene.remove(m);meshes.clear()}function say(t){$('msg').textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>{$('msg').textContent=remote?'🌐 Servidor Bedrock ONLINE':'🎮 Mundo local'},2500)}function local(){remote=false;$('menu').style.display='none';$('game').style.display='block';clear();for(let x=-16;x<=16;x++)for(let z=-16;z<=16;z++){let h=3+Math.max(0,Math.floor(Math.sin(x*.32)*1.4+Math.cos(z*.27)*1.4));for(let y=0;y<=h;y++)add(x,y,z,y===h?'grass':y>=h-2?'dirt':'stone')}cam.position.set(0,7,12);cam.rotation.set(0,0,0);say('🎮 Mundo local')}function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o))}function setPos(p){if(!p)return;let x=+p.x,y=+p.y,z=+p.z;if([x,y,z].every(Number.isFinite)){cam.position.set(x,y+1.62,z);cam.rotation.order='YXZ'}}function connect(){let h=$('host').value.trim();if(!h)return;$('menu').style.display='none';$('game').style.display='block';say('🔄 Conectando al servidor…');ws=new WebSocket(RELAY);ws.onopen=()=>send({type:'connect',host:h,port:+$('port').value||19132,username:$('user').value||'SoyPerrito',offline:true});ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='ready')$('status').textContent='🟢 Puente online';if(m.type==='connecting')say('🔄 Conectando…');if(m.type==='connected'){remote=true;$('online').textContent='ONLINE';say('🟢 Servidor conectado')}if(m.type==='spawn'){setPos(m.position);send({type:'sync_world'});say('🌍 Cargando mundo…')}if(m.type==='world_snapshot'){clear();for(const b of m.blocks||[])add(b.x,b.y,b.z,String(b.name||'stone').replace('minecraft:','').includes('grass')?'grass':String(b.name||'stone').includes('dirt')?'dirt':String(b.name||'stone').includes('wood')?'wood':String(b.name||'stone').includes('sand')?'sand':'stone');setPos(m.center);say('🌍 Mundo del servidor visible')}if(m.type==='self')setPos(m.position);if(m.type==='health')$('health').textContent=m.health??10;if(m.type==='chat'){let d=document.createElement('div');d.textContent=(m.source?m.source+': ':'')+m.message;$('chatLog').append(d)}if(m.type==='error'||m.type==='action_error')say('⚠️ '+m.message);if(m.type==='disconnected')say('🔴 Servidor desconectado')};ws.onerror=()=>say('❌ No se pudo conectar al puente');ws.onclose=()=>remote=false}function controls(){if(remote)send({type:'controls',...move})}function setMove(k,v){move[k]=v;controls()}function touchJoystick(e){e.preventDefault();const r=$('joy').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,lim=43,len=Math.hypot(dx,dy);if(len>lim){dx*=lim/len;dy*=lim/len}$('knob').style.transform=`translate(${dx}px,${dy}px)`;setMove('left',dx<-15);setMove('right',dx>15);setMove('forward',dy<-15);setMove('back',dy>15)}$('joy').addEventListener('pointerdown',e=>{joyActive=true;$('joy').setPointerCapture(e.pointerId);touchJoystick(e)});$('joy').addEventListener('pointermove',e=>{if(joyActive)touchJoystick(e)});$('joy').addEventListener('pointerup',e=>{joyActive=false;$('knob').style.transform='';['left','right','forward','back'].forEach(k=>setMove(k,false))});$('jump').onclick=()=>remote&&send({type:'controls',jump:true});function hit(){let r=new THREE.Raycaster();r.setFromCamera({x:0,y:0},cam);return r.intersectObjects([...meshes.values()])[0]}$('break').onclick=()=>{let h=hit();if(h){let b=h.object.userData;if(remote)send({type:'break',x:b.x,y:b.y,z:b.z);else{scene.remove(h.object);meshes.delete(b.x+'|'+b.y+'|'+b.z)}}};$('place').onclick=()=>{let h=hit();if(!h)return;let b=h.object.userData,n=h.face.normal;if(remote)send({type:'place',x:b.x,y:b.y,z:b.z,fx:Math.round(n.x),fy:Math.round(n.y),fz:Math.round(n.z)});else add(b.x+Math.round(n.x),b.y+Math.round(n.y),b.z+Math.round(n.z),blocks[sel])};function hot(){let h=$('hotbar');h.innerHTML='';blocks.forEach((n,i)=>{let b=document.createElement('button');b.className='slot'+(i===sel?' sel':'');b.textContent=['🟩','🟫','🪨','🪵','🟨','🔷','🧱','🟡'][i];b.onclick=()=>{sel=i;hot()};h.append(b)})}hot();$('play').onclick=local;$('create').onclick=local;$('servers').onclick=()=>form.style.display='block';$('connect').onclick=connect;$('back').onclick=()=>location.reload();$('send').onclick=()=>{let t=$('chatText').value.trim();if(t){send({type:'chat',message:t});$('chatText').value=''}};$('closeChat').onclick=()=>chatPanel.classList.remove('open');addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')setMove('forward',true);if(k==='s'||k==='arrowdown')setMove('back',true);if(k==='a'||k==='arrowleft')setMove('left',true);if(k==='d'||k==='arrowright')setMove('right',true);if(k===' ')$('jump').click()});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')setMove('forward',false);if(k==='s'||k==='arrowdown')setMove('back',false);if(k==='a'||k==='arrowleft')setMove('left',false);if(k==='d'||k==='arrowright')setMove('right',false)});let lastX=0,lastY=0,look=false;$('lookzone').addEventListener('pointerdown',e=>{look=true;lastX=e.clientX;lastY=e.clientY;$('lookzone').setPointerCapture(e.pointerId)});$('lookzone').addEventListener('pointermove',e=>{if(!look)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.35;pitch=Math.max(-89,Math.min(89,pitch-dy*.35));if(remote)send({type:'look',yaw,pitch})});$('lookzone').addEventListener('pointerup',()=>look=false);renderer.domElement.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.2;pitch=Math.max(-89,Math.min(89,pitch-e.movementY*.2));if(remote)send({type:'look',yaw,pitch})}});renderer.domElement.addEventListener('click',()=>renderer.domElement.requestPointerLock?.());addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function loop(){renderer.render(scene,cam);requestAnimationFrame(loop)}loop();</script></body></html>
