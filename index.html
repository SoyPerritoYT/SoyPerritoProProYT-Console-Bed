<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>🐶 SoyPerritoProProYT-Bed</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:white;font-family:Arial;text-align:center}main{max-width:900px;margin:auto;padding:12px}.game{background:#222;border-radius:18px;padding:12px}.world{position:relative;height:58vh;min-height:330px;max-height:560px;overflow:hidden;border:4px solid #555;border-radius:14px;background:linear-gradient(#73c9ff 0 48%,#61b94d 48% 100%)}.sun{position:absolute;right:10%;top:8%;font-size:50px}.block{position:absolute;font-size:38px}.b1{left:10%;bottom:20%}.b2{left:30%;bottom:18%}.b3{right:18%;bottom:24%}.dog{position:absolute;left:50%;top:52%;font-size:70px;transform:translate(-50%,-50%);transition:.1s}.hud{margin:8px;font-size:18px}.buttons button,.skins button{margin:4px;padding:12px;border:0;border-radius:12px;font-weight:bold;font-size:15px}.controls{display:grid;grid-template-columns:repeat(3,70px);justify-content:center;gap:6px;margin:10px}.controls button{height:58px;border:0;border-radius:12px;background:#333;color:white;font-size:24px}.panel{background:#181818;border-radius:14px;padding:10px;margin-top:10px}.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.skin{background:#333;color:white}.free{color:#67e67b;font-size:12px}</style></head>
<body><main><h1>🐶 SoyPerritoProProYT-Bed</h1><p>🌍 Mundo de bloques • 🆓 Todo gratis</p><div class="game"><div class="hud">❤️ Vida: <span id="vida">10</span> | 🪙 Bloques: <span id="bloques">20</span></div><div class="world"><div class="sun">☀️</div><div class="block b1">🟫</div><div class="block b2">🟩</div><div class="block b3">🟫</div><div class="dog" id="dog">🐶</div></div><div class="controls"><span></span><button data-d="up">⬆️</button><span></span><button data-d="left">⬅️</button><button id="action">⛏️</button><button data-d="right">➡️</button><span></span><button data-d="down">⬇️</button><span></span></div><div class="buttons"><button id="break">⛏️ ROMPER</button><button id="place">🧱 COLOCAR</button><button id="save">💾 GUARDAR</button><button id="load">📂 CARGAR</button><button id="reset">🔄 NUEVA</button></div><p id="msg">🎮 ¡Bienvenido a tu mundo!</p><div class="panel"><h2>👕 8 SKINS DE SOYPERRITOPROPROYT</h2><div class="skins" id="skins"></div></div></div></main><script>
let x=0,y=0,vida=10,bloques=20,skin=0;const dog=document.getElementById('dog'),msg=document.getElementById('msg');const skins=['🐶','🐶🎮','🐶🧢','🐶⭐','🐶🕶️','🐶👑','🐶💻','🐶🚀'];
function render(){dog.textContent=skins[skin];dog.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;document.getElementById('vida').textContent=vida;document.getElementById('bloques').textContent=bloques}function move(d){if(d==='up')y-=25;if(d==='down')y+=25;if(d==='left')x-=25;if(d==='right')x+=25;x=Math.max(-220,Math.min(220,x));y=Math.max(-130,Math.min(130,y));render()}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(b.dataset.d));document.getElementById('break').onclick=()=>{if(bloques>0){bloques--;msg.textContent='⛏️ ¡Bloque roto!';render()}};document.getElementById('place').onclick=()=>{bloques++;msg.textContent='🧱 ¡Bloque colocado!';render()};document.getElementById('action').onclick=()=>{msg.textContent='🐶 ¡Acción!';};document.getElementById('save').onclick=()=>{localStorage.setItem('spbed',JSON.stringify({x,y,vida,bloques,skin}));msg.textContent='💾 Partida guardada.'};document.getElementById('load').onclick=()=>{let s=JSON.parse(localStorage.getItem('spbed')||'null');if(s){({x,y,vida,bloques,skin}=s);render();msg.textContent='📂 Partida cargada.'}else msg.textContent='❌ No hay partida guardada.'};document.getElementById('reset').onclick=()=>{x=y=0;vida=10;bloques=20;skin=0;render();msg.textContent='🔄 Mundo nuevo.'};skins.forEach((s,i)=>{let b=document.createElement('button');b.className='skin';b.innerHTML=`${s}<br><span class="free">🆓 GRATIS</span>`;b.onclick=()=>{skin=i;render();msg.textContent='👕 Skin '+(i+1)+' equipada.'};document.getElementById('skins').appendChild(b)});render();
</script></body></html>
