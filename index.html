<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>🐶 SoyPerritoProProYT-Bed</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif;color:#fff}#menu{position:fixed;inset:0;z-index:999;background:linear-gradient(#0005,#0009),linear-gradient(135deg,#65b8ff,#237a3b);display:flex;align-items:center;justify-content:center;text-align:center}#menu .box{width:min(520px,90vw);padding:28px 18px;border:3px solid #ffffff66;border-radius:20px;background:#101820e8;box-shadow:0 12px 50px #000b}#menu h1{font-size:clamp(28px,7vw,48px);margin:0 0 6px;text-shadow:3px 4px #000}#menu p{margin:0 0 22px;color:#ddd}#menu button{display:block;width:100%;margin:9px 0;padding:15px;border:2px solid #ffffff55;border-radius:12px;background:#263746;color:#fff;font-size:18px;font-weight:bold}#menu button:hover{background:#3d5366}#menu .play{background:#2f8f3a;font-size:22px}#menu small{display:block;margin-top:15px;color:#aaa}#game{display:none;position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}.box{background:#101820df;border:2px solid #ffffff44;border-radius:12px;padding:7px 9px;font-weight:bold;text-shadow:1px 2px #000}.title{font-size:17px}.stats{font-size:13px}.cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:25px;text-shadow:0 2px 3px #000;pointer-events:none;z-index:4}.msg{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#000c;padding:8px 12px;border-radius:10px;z-index:40}.topbuttons{position:fixed;right:8px;top:52px;display:flex;gap:5px;z-index:30}.button{border:0;border-radius:9px;background:#14202de8;color:#fff;padding:9px;font-weight:bold}.hotbar{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:#101820dd;padding:5px;border:2px solid #77818c;border-radius:12px;z-index:30}.slot{width:48px;height:48px;border:2px solid #65717c;border-radius:8px;background:#26313c;color:#fff;font-size:21px}.slot.sel{border-color:#fff;box-shadow:0 0 0 2px #ffd84d inset}.mobile{display:none;position:fixed;z-index:35;touch-action:none;user-select:none}.joy{left:15px;bottom:24px;width:132px;height:132px;border-radius:50%;background:#10182088;border:3px solid #ffffff66}.joyknob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:#ffffff66;border:2px solid #fff;pointer-events:none}.tools{right:15px;bottom:24px;flex-direction:column;gap:6px}.tools button{width:58px;height:58px;border:1px solid #aab4bd;border-radius:11px;background:#14202dcc;color:#fff;font-size:22px}.lookhint{display:none;position:fixed;right:85px;top:50%;transform:translateY(-50%);background:#0007;padding:6px 9px;border-radius:8px;font-size:12px;z-index:6;pointer-events:none}.panel{display:none;position:fixed;inset:7% 5%;z-index:60;background:#111b24f5;border:3px solid #82909c;border-radius:16px;padding:14px;overflow:auto}.panel.open{display:block}.panel h2{margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(65px,1fr));gap:7px}.item{min-height:65px;border:2px solid #58636d;border-radius:9px;background:#26313c;color:#fff;font-size:25px}.item small{display:block;font-size:10px}.close{float:right;font-size:20px}.mode{color:#7dff8d}@media(pointer:coarse){.mobile{display:flex}.lookhint{display:block}}@media(max-width:650px){.slot{width:43px;height:43px;font-size:18px}.title{font-size:13px}} </style></head><body><div id="menu"><div class="box"><h1>🐶 SoyPerritoProProYT-Bed</h1><p>Tu mundo de bloques 3D</p><button class="play" id="play">▶️ JUGAR</button><button id="worlds">🌎 MUNDOS</button><button id="servers">🖥️ SERVIDORES</button><button id="create">➕ CREAR NUEVO MUNDO</button><button id="profile">👤 PERFIL / VESTIDOR</button><button id="settings">⚙️ AJUSTES</button><small>Bed · versión de desarrollo</small></div></div><div id="game"><div class="hud"><div class="box title">🐶 SoyPerritoProProYT-Bed 3D</div><div class="box stats">❤️ <span id="hp">10</span> · <span class="mode" id="mode">CREATIVO</span></div></div><div class="cross">+</div><div class="topbuttons"><button class="button" id="inv">🎒</button><button class="button" id="modeBtn">🟢</button><button class="button" id="save">💾</button><button class="button" id="load">📂</button><button class="button" id="new">🌍</button><button class="button" id="menuBtn">☰</button></div><div class="msg" id="msg">Cargando mundo 3D…</div><div class="lookhint">👆 Arrastra para mirar</div><div class="hotbar" id="hotbar"></div><div class="mobile joy" id="joy"><div class="joyknob" id="joyknob"></div></div><div class="mobile tools"><button id="jump">🦘</button><button id="break">⛏️</button><button id="place">🧱</button></div><div class="panel" id="inventory"><button class="button close" id="closeInv">✖</button><h2>🎒 Inventario <span id="invMode"></span></h2><p>Selecciona cualquier bloque para ponerlo en la hotbar.</p><div class="grid" id="invGrid"></div></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const $=id=>document.getElementById(id);let started=false;function enterGame(){started=true;$('menu').style.display='none';$('game').style.display='block';say('🎮 ¡Mundo cargado!');}function backMenu(){started=false;$('game').style.display='none';$('menu').style.display='flex';}function say(t){$('msg').textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>$('msg').textContent='🎮 Explora, rompe y construye.',2200)}$('play').onclick=enterGame;$('menuBtn').onclick=backMenu;$('worlds').onclick=()=>alert('🌎 Mundos: usa CREAR NUEVO MUNDO para generar uno nuevo.');$('servers').onclick=()=>location.href='menu.html#servers';$('create').onclick=()=>{enterGame();setTimeout(()=>$('new').click(),100)};$('profile').onclick=()=>alert('👤 Perfil / Vestidor\n🐶 SoyPerritoProProYT');$('settings').onclick=()=>alert('⚙️ Ajustes\n🎮 Controles táctiles y teclado\n🔊 Audio próximamente');const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,100),renderer=new THREE.WebGLRenderer({antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;$('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xbfeeff,0x426b3d,1.7));const sun=new THREE.DirectionalLight(0xffffff,2);scene.add(sun);const cube=new THREE.BoxGeometry(1,1,1);const defs=[['grass','🟩','Hierba',0x5cae3c],['dirt','🟫','Tierra',0x8c5a35],['stone','🪨','Piedra',0x777d83],['wood','🪵','Madera',0x8a5a32],['leaves','🌿','Hojas',0x277d36],['sand','🟨','Arena',0xd8c27b],['water','🟦','Agua',0x3d9fd2],['glass','🔷','Cristal',0x8ed8ff],['brick','🧱','Ladrillo',0xa44a3d],['gold','🟨','Oro',0xe0b83b],['diamond','💎','Diamante',0x36d9e8],['snow','⬜','Nieve',0xeaf7ff],['obsidian','⬛','Obsidiana',0x302340],['glow','✨','Luz',0xffe47a],['bedrock','🟪','Bedrock',0x303038]];const types=defs.map(x=>x[0]),icons=defs.map(x=>x[1]),names=defs.map(x=>x[2]),mat=Object.fromEntries(defs.map(x=>[x[0],new THREE.MeshLambertMaterial({color:x[3],transparent:x[0]==='water'||x[0]==='glass',opacity:x[0]==='water'?.68:x[0]==='glass'?.45:1})]));const world=new Map(),meshes=new Map(),K=(x,y,z)=>x+'|'+y+'|'+z;let selected=0,coins=0,hp=10,creative=true,worldTime=0;function mesh(x,y,z,t){const k=K(x,y,z),m=new THREE.Mesh(cube,mat[t]||mat.grass);m.position.set(x+.5,y+.5,z+.5);m.userData.block={x,y,z,type:t};scene.add(m);meshes.set(k,m)}function add(x,y,z,t){if(y>=0&&y<=18){world.set(K(x,y,z),t);mesh(x,y,z,t)}}function clear(){for(const m of meshes.values())scene.remove(m);meshes.clear()}function heightAt(x,z){return Math.max(1,Math.floor(3+Math.sin(x*.42)*.8+Math.cos(z*.37)*.8+Math.sin((x+z)*.2)*.6))}function makeWorld(){world.clear();clear();for(let x=-18;x<18;x++)for(let z=-18;z<18;z++){let h=heightAt(x,z);for(let y=0;y<=h;y++)add(x,y,z,y===h?'grass':y>h-3?'dirt':'stone');if((x*17+z*31)%43===0&&h<7){for(let y=1;y<=3;y++)add(x,h+y,z,'wood');for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=2;dy<=4;dy++)if(Math.abs(dx)+Math.abs(dz)+dy<7)add(x+dx,h+dy,z+dz,'leaves')}}}makeWorld();const player={p:new THREE.Vector3(.5,heightAt(0,6)+1.05,6.5),v:new THREE.Vector3(),yaw:0,pitch:0,ground:false},keys={w:false,a:false,s:false,d:false};function updateHUD(){$('hp').textContent=hp;$('mode').textContent=creative?'CREATIVO':'SUPERVIVENCIA';$('invMode').textContent=creative?'· TODOS LOS BLOQUES ∞':''}function jump(){if(creative||player.ground){player.v.y=7;player.ground=false}}function solid(x,y,z){return world.has(K(Math.floor(x),Math.floor(y),Math.floor(z)))}function collideXZ(p){const r=.27;for(let x=Math.floor(p.x-r);x<=Math.floor(p.x+r);x++)for(let z=Math.floor(p.z-r);z<=Math.floor(p.z+r);z++)for(let y=Math.floor(p.y-1.55);y<=Math.floor(p.y+.05);y++)if(solid(x,y,z))return true;return false}function groundY(x,z){for(let y=18;y>=0;y--)if(solid(x,y,z))return y+1.001;return 1}function update(dt){const speed=creative?7:5.4,f=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw)),r=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw)),dir=new THREE.Vector3();if(keys.w)dir.add(f);if(keys.s)dir.sub(f);if(keys.d)dir.add(r);if(keys.a)dir.sub(r);if(dir.lengthSq())dir.normalize().multiplyScalar(speed*dt);let q=player.p.clone();q.x+=dir.x;if(!collideXZ(q))player.p.x=q.x;q=player.p.clone();q.z+=dir.z;if(!collideXZ(q))player.p.z=q.z;if(creative){player.p.y=Math.max(player.p.y,groundY(player.p.x,player.p.z)+.65);player.v.y=0;player.ground=true}else{player.v.y-=18*dt;q=player.p.clone();q.y+=player.v.y*dt;if(!collideXZ(q)){player.p.y=q.y;player.ground=false}else{if(player.v.y<0)player.ground=true;player.v.y=0}}if(player.p.y<-5){player.p.set(.5,heightAt(0,6)+1.05,6.5);player.v.set(0,0,0)}camera.position.set(player.p.x,player.p.y+1.65,player.p.z);camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch}renderer.domElement.addEventListener('click',()=>{if(innerWidth>700)renderer.domElement.requestPointerLock?.()});let locked=false;document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);document.addEventListener('mousemove',e=>{if(locked){player.yaw-=e.movementX*.0022;player.pitch=Math.max(-1.45,Math.min(1.45,player.pitch-e.movementY*.0022))}});addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k in keys)keys[k]=true;if(e.code==='Space'){e.preventDefault();jump()}if(k==='i')toggleInv();if(k==='c')toggleMode();if(/^\d$/.test(e.key)){const n=+e.key-1;if(n<types.length){selected=n;hotbar()}}});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k in keys)keys[k]=false});const ray=new THREE.Raycaster();function hit(){ray.setFromCamera(new THREE.Vector2(0,0),camera);const a=ray.intersectObjects([...meshes.values()]);return a[0]&&a[0].distance<=7?a[0]:null}function breakBlock(){const h=hit();if(!h){say('⛏️ Mira a un bloque');return}const b=h.object.userData.block;if(b.y===0&&!creative)return;if(b.type==='bedrock'&&!creative)return;world.delete(K(b.x,b.y,b.z));scene.remove(h.object);meshes.delete(K(b.x,b.y,b.z));if(!creative)coins++;updateHUD()}function placeBlock(){const h=hit();if(!h){say('🧱 Mira a un bloque');return}const b=h.object.userData.block,n=h.face.normal,x=b.x+Math.round(n.x),y=b.y+Math.round(n.y),z=b.z+Math.round(n.z);if(y<0||y>18||world.has(K(x,y,z)))return;add(x,y,z,types[selected])}function hotbar(){const h=$('hotbar');h.innerHTML='';types.slice(0,8).forEach((t,i)=>{const b=document.createElement('button');b.className='slot'+(i===selected?' sel':'');b.textContent=icons[i];b.title=names[i];b.onclick=()=>{selected=i;hotbar()};h.appendChild(b)})}function buildInventory(){const g=$('invGrid');g.innerHTML='';types.forEach((t,i)=>{const b=document.createElement('button');b.className='item';b.innerHTML=icons[i]+'<small>'+names[i]+'</small>';b.onclick=()=>{selected=i;hotbar();toggleInv();say('🎒 '+names[i]+' seleccionado')};g.appendChild(b)})}function toggleInv(){const p=$('inventory');p.classList.toggle('open');if(p.classList.contains('open'))buildInventory()}function toggleMode(){creative=!creative;updateHUD();say(creative?'🟢 Modo creativo':'🟠 Supervivencia')}$('inv').onclick=toggleInv;$('closeInv').onclick=toggleInv;$('modeBtn').onclick=toggleMode;$('break').onclick=breakBlock;$('place').onclick=placeBlock;$('jump').onclick=jump;$('new').onclick=()=>{makeWorld();player.p.set(.5,heightAt(0,6)+1.05,6.5);say('🌍 Nuevo mundo')};renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){if(e.button===0)breakBlock();if(e.button===2)placeBlock()}});renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());hotbar();const joy=$('joy'),knob=$('joyknob');let joyActive=false,joyId=null;function joyReset(){joyActive=false;joyId=null;knob.style.transform='translate(0,0)';keys.w=keys.a=keys.s=keys.d=false}function joyMove(e){if(!joyActive||e.pointerId!==joyId)return;e.preventDefault();const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=42,len=Math.hypot(dx,dy),scale=len>max?max/len:1,x=dx*scale,y=dy*scale;knob.style.transform=`translate(${x}px,${y}px)`;const dead=9;keys.w=y<-dead;keys.s=y>dead;keys.a=x<-dead;keys.d=x>dead}joy.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();joyActive=true;joyId=e.pointerId;joy.setPointerCapture?.(e.pointerId)});joy.addEventListener('pointermove',joyMove,{passive:false});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>joy.addEventListener(ev,e=>{e.preventDefault();joyReset()},{passive:false}));let lookId=null,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY}},{passive:true});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerType==='touch'&&e.pointerId===lookId){const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;player.yaw-=dx*.006;player.pitch=Math.max(-1.45,Math.min(1.45,player.pitch-dy*.006))}},{passive:true});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});function save(){localStorage.setItem('spbed3d',JSON.stringify({blocks:[...world],p:[player.p.x,player.p.y,player.p.z],yaw:player.yaw,pitch:player.pitch,coins,hp,creative,selected}));say('💾 Mundo guardado')}function load(){try{const d=JSON.parse(localStorage.getItem('spbed3d')||'null');if(!d)return;world.clear();clear();for(const [k,t] of d.blocks){const [x,y,z]=k.split('|').map(Number);add(x,y,z,t)}player.p.set(...d.p);player.yaw=d.yaw;player.pitch=d.pitch;coins=d.coins||0;hp=d.hp||10;creative=d.creative??true;selected=d.selected||0;updateHUD();hotbar();say('📂 Mundo cargado')}catch{say('❌ Error al cargar')}}$('save').onclick=save;$('load').onclick=load;let last=performance.now();function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;worldTime+=dt*.25;const daylight=(Math.sin(worldTime)+1)/2;sun.position.set(Math.cos(worldTime)*28,8+daylight*25,Math.sin(worldTime)*28);sun.intensity=.45+daylight*1.8;hemi.intensity=.7+daylight*1.1;const sky=new THREE.Color().setHSL(.56,.75,.48+daylight*.2);scene.background=sky;scene.fog=new THREE.Fog(sky,22,70);if(started)update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}updateHUD();requestAnimationFrame(loop);</script></body></html>
